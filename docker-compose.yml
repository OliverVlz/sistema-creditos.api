services:
  postgres:
    image: postgres:16
    container_name: sistema_creditos_postgres_dev
    environment:
      POSTGRES_DB: sistema_creditos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - sistema_creditos_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sistema_creditos']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sistema_creditos_network

  app:
    build:
      context: .
      target: development
    container_name: sistema_creditos_app_dev
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: sistema_creditos
      FORCE_SEED: ${FORCE_SEED:-false}
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 2000
      WATCHPACK_POLLING: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - sistema_creditos_network

volumes:
  sistema_creditos_postgres_data:

networks:
  sistema_creditos_network:
    driver: bridge
